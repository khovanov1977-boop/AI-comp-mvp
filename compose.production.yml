name: ai-companion

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_companion
      POSTGRES_USER: ai_companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_companion -d ai_companion"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+psycopg://ai_companion:${POSTGRES_PASSWORD}@db:5432/ai_companion
      FRONTEND_ORIGIN: https://aicomp.fun
      LLM_PROVIDER: venice
      STT_PROVIDER: venice
      TTS_PROVIDER: venice
      IMAGE_PROVIDER: venice
      VENICE_API_KEY: ${VENICE_API_KEY:?Set VENICE_API_KEY in .env.production}
      BETA_DEPLOYMENT: "true"
      BETA_SAFE_ERRORS: "true"
    volumes:
      - app_data:/app/data
    networks:
      - database
      - frontend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      - web

networks:
  database:
    internal: true
  frontend:

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
